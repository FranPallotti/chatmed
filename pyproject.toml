[project]
name = "chatmed"
version = "0.1.0"
description = "Session-scoped agent over tenant DB + uploaded medical PDFs (no document persistence)"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "openai>=1.40",
    "azure-identity>=1.17",
    "duckdb>=1.1",
    "pymupdf>=1.24",
    "psycopg[binary]>=3.2",
    "aiohttp>=3.9",  # required by azure.identity.aio (async Entra ID auth)
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chatmed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-m 'not azure'"
markers = [
    "azure: hits real Azure services; opt-in with -m azure",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
files = ["src"]
ignore_missing_imports = true
warn_unused_ignores = true
